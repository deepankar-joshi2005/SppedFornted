<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>PDF Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #525659;
    }
    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: -apple-system, Roboto, sans-serif;
      font-size: 14px;
      z-index: 10;
      background: #525659;
    }
    #status.hidden {
      display: none;
    }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 32px;
    }
    .page-canvas {
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="status">Loading PDF&hellip;</div>
  <div id="pages"></div>
  <script>
    var WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var workerBlobUrl = null;

    function post(msg) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    }

    function setStatus(text, hide) {
      var el = document.getElementById("status");
      if (!el) return;
      el.textContent = text || "";
      el.classList.toggle("hidden", !!hide);
    }

    // A file://-origin page can't create a Worker() directly from a cross-origin
    // (CDN) script URL — same-origin restrictions apply to Worker scripts even
    // though <script src> allows cross-origin. Fetching the worker source and
    // running it from a Blob URL (same-origin by construction) avoids that.
    async function ensureWorkerBlobUrl() {
      if (workerBlobUrl) return workerBlobUrl;
      var res = await fetch(WORKER_URL);
      var code = await res.text();
      var blob = new Blob([code], { type: "application/javascript" });
      workerBlobUrl = URL.createObjectURL(blob);
      return workerBlobUrl;
    }

    window.loadPdf = async function (fileUrl, title) {
      try {
        setStatus("Loading PDF…", false);
        var container = document.getElementById("pages");
        container.innerHTML = "";
        if (title) {
          document.title = title;
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc = await ensureWorkerBlobUrl();

        var pdf = await pdfjsLib.getDocument(fileUrl).promise;
        var canvases = new Array(pdf.numPages + 1);
        var rendered = new Array(pdf.numPages + 1).fill(false);
        var rendering = new Array(pdf.numPages + 1).fill(false);

        // Lay out every page up front (viewport metadata only, no pixels
        // painted yet) so the scroll area sizes correctly immediately —
        // same look as before, just without decoding all pages at once.
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var viewport = page.getViewport({ scale: 1.4 });
          var canvas = document.createElement("canvas");
          canvas.className = "page-canvas";
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.dataset.pageNum = String(i);
          container.appendChild(canvas);
          canvases[i] = canvas;
        }

        async function renderPage(num) {
          if (rendered[num] || rendering[num]) return;
          rendering[num] = true;
          try {
            var page = await pdf.getPage(num);
            var viewport = page.getViewport({ scale: 1.4 });
            var context = canvases[num].getContext("2d");
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            rendered[num] = true;
            post({ type: "progress", page: num, numPages: pdf.numPages });
          } catch (err) {
            // A single page failing to render shouldn't fail the whole
            // document — just leave that page blank.
          } finally {
            rendering[num] = false;
          }
        }

        // Render pages only as they scroll near the viewport, instead of
        // blocking on every page up front — this is what keeps a large
        // (many-page / image-heavy) PDF from hanging or OOM-ing the WebView.
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                renderPage(Number(entry.target.dataset.pageNum));
              }
            });
          },
          { rootMargin: "1200px 0px", threshold: 0.01 }
        );
        for (var p = 1; p <= pdf.numPages; p++) {
          observer.observe(canvases[p]);
        }

        // Render the first page synchronously so there's visible content
        // the moment the loading spinner disappears.
        await renderPage(1);

        setStatus("", true);
        post({ type: "loaded", numPages: pdf.numPages });
      } catch (err) {
        setStatus("Failed to load PDF", false);
        post({ type: "error", message: (err && err.message) || String(err) });
      }
    };

    window.addEventListener("DOMContentLoaded", function () {
      post({ type: "ready" });
    });

    // Convenience fallback: also supports being opened directly with
    // ?file=<url>&title=<title>, in case a caller loads this page by URL
    // instead of driving it via postMessage/injectJavaScript.
    try {
      var params = new URLSearchParams(location.search);
      var qFile = params.get("file");
      if (qFile) {
        window.loadPdf(qFile, params.get("title") || "");
      }
    } catch (e) {}
  </script>
</body>
</html>
